ignoreScripts: true
minimumReleaseAge: 7200
trustPolicy: no-downgrade
catalogMode: prefer
strictDepBuilds: true
blockExoticSubdeps: true

minimumReleaseAgeExclude:
  - "@handy-computer/recorder@0.1.0"

catalogs:
  dev:
    "@types/node": 24.13.6
    oxfmt: 0.70.0
    oxlint: 1.85.0
    oxlint-tsgolint: 7.0.2002
    publint: 0.3.24
    tsdown: 0.23.0
    typescript: 7.0.2
    vitest: 5.0.1
    vitest-testdirs: 4.5.1

  runtime:
    "@handy-computer/recorder": 0.1.0
    transcribe-cpp: 0.2.4
    typebox: 1.3.27
