ignoreScripts: true
minimumReleaseAge: 7200
trustPolicy: no-downgrade
catalogMode: prefer
strictDepBuilds: true
blockExoticSubdeps: true

minimumReleaseAgeExclude:
  - "@handy-computer/recorder@0.1.0"

catalogs:
  dev:
    "@types/node": 26.6.5
    oxfmt: 0.74.0
    oxlint: 1.87.0
    oxlint-tsgolint: 7.0.2005
    publint: 0.3.25
    tsdown: 0.23.2
    typescript: 7.0.2
    vitest: 5.0.3
    vitest-testdirs: 4.5.2

  runtime:
    "@handy-computer/recorder": 0.2.1
    transcribe-cpp: 0.4.1
    typebox: 1.4.3
